# no-auth: serve the SPA + proxy /api. STRIPS inbound X-Remote-User-* so identity can't
# be spoofed; clapshot-server falls back to --default-user (anonymous).
server {
    listen 80 default_server;
    absolute_redirect off;

    location /api/health { proxy_pass http://clapshot-server:8095/api/health; }

    location / {
        root /var/www/clapshot-client;
        index index.html;
        try_files $uri $uri/ =404;
        location /videos { alias /mnt/clapshot-data/data/videos; }
        include snippets/clapshot-cache.conf;
    }

    location /api {
        # No auth here — make sure nobody can spoof identity.
        proxy_set_header X-Remote-User-Id "";
        proxy_set_header X-Remote-User-Name "";
        proxy_set_header X-Remote-User-Is-Admin "";
        proxy_set_header X-Remote-User-Can-Upload "";
        proxy_pass http://clapshot-server:8095/api;
        include snippets/clapshot-proxy-params.conf;
    }

    error_page 502 504 @down;
    location @down {
        default_type text/html;
        return 502 '<!doctype html><meta charset="utf-8"><title>Clapshot</title><h1>Clapshot backend not running</h1>';
    }
}
