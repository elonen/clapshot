name: clapshot-no-auth

# Clapshot with NO authentication: every request is 'anonymous' (site.conf strips any
# inbound X-Remote-User-*). Local dev / evaluation only. Edit only .env (see .env.example).

services:
  config-check:
    image: ghcr.io/elonen/clapshot-server:${CLAPSHOT_VERSION:-latest}
    entrypoint: ["/usr/local/bin/clapshot-config-check"]
    environment:
      CLAPSHOT_URL_BASE: "${CLAPSHOT_URL_BASE:-http://127.0.0.1:8080/}"
      CADDY_CERT_DOMAIN: "${CADDY_CERT_DOMAIN:-}"
      CADDY_TLS_CERT: "${CADDY_TLS_CERT:-}"
    restart: "no"

  clapshot-server:
    image: ghcr.io/elonen/clapshot-server:${CLAPSHOT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      config-check: { condition: service_completed_successfully }
    environment:
      CLAPSHOT_SERVER__URL_BASE: "${CLAPSHOT_URL_BASE:-http://127.0.0.1:8080/}"
      CLAPSHOT_SERVER__CORS: "${CLAPSHOT_CORS:-$CLAPSHOT_URL_BASE}"
    volumes:
      - "${CLAPSHOT_DATA_DIR:-clapshot-data}:/mnt/clapshot-data/data"

  clapshot-web:
    image: ghcr.io/elonen/clapshot-web:${CLAPSHOT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      clapshot-server: { condition: service_started }
    environment:
      CLAPSHOT_URL_BASE: "${CLAPSHOT_URL_BASE:-http://127.0.0.1:8080/}"
      CLAPSHOT_APP_TITLE: "${CLAPSHOT_APP_TITLE:-Clapshot}"
      CLAPSHOT_LOGO_URL: "${CLAPSHOT_LOGO_URL:-clapshot-logo.svg}"
    volumes:
      - "./site.conf:/etc/nginx/conf.d/default.conf:ro"
      - "${CLAPSHOT_DATA_DIR:-clapshot-data}:/mnt/clapshot-data/data:ro"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      clapshot-web: { condition: service_started }
    environment:
      CADDY_SITE_ADDRESS: "${CADDY_CERT_DOMAIN:-:80}"
      CADDY_GLOBAL: "${CADDY_ACME_EMAIL:+email }${CADDY_ACME_EMAIL:-}"
      CADDY_TLS: "${CADDY_TLS_CERT:+tls }${CADDY_TLS_CERT:-}${CADDY_TLS_KEY:+ }${CADDY_TLS_KEY:-}"
    ports:
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "${CADDY_DATA_DIR:-caddy-data}:/data"
      - caddy-config:/config

volumes:
  clapshot-data:
  caddy-data:
  caddy-config:
