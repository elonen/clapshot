# custom-proxy: serve the SPA + proxy /api. TRUSTS the X-Remote-User-* headers from your
# front proxy. SECURITY: your proxy MUST authenticate every request, set these headers, and
# STRIP any client-supplied ones — and this stack must be reachable only through your proxy.
server {
    listen 80 default_server;
    absolute_redirect off;
    underscores_in_headers off;   # drop client X_Remote_User_* spoofs (only hyphen names are forwarded from the proxy)

    location /api/health { proxy_pass http://clapshot-server:8095/api/health; }

    location / {
        root /var/www/clapshot-client;
        index index.html;
        try_files $uri $uri/ =404;
        location /videos { alias /mnt/clapshot-data/data/videos; }
        include snippets/clapshot-cache.conf;
    }

    location /api {
        # Trust the identity your proxy set (see security note above).
        proxy_set_header X-Remote-User-Id         $http_x_remote_user_id;
        proxy_set_header X-Remote-User-Name       $http_x_remote_user_name;
        proxy_set_header X-Remote-User-Is-Admin   $http_x_remote_user_is_admin;
        proxy_set_header X-Remote-User-Can-Upload $http_x_remote_user_can_upload;
        proxy_pass http://clapshot-server:8095/api;
        include snippets/clapshot-proxy-params.conf;
    }

    error_page 502 504 @down;
    location @down {
        default_type text/html;
        return 502 '<!doctype html><meta charset="utf-8"><title>Clapshot</title><h1>Clapshot backend not running</h1>';
    }
}
