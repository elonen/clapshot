# HTWicket configuration for the Clapshot HTWicket recipe.
# Versioned config — mounted read-only, edited via the repo (git pull to upgrade), NOT by
# hand. Per-deployment knobs (listen, cookies, title, hash) come from HTWICKET_* env.
# State (.htpasswd, sidecar, jwt_secret) lives on the /data volume.

htpasswd_file = "/data/.htpasswd"      # users (state)
sidecar_file  = "/data/sidecar.toml"   # per-user fields: is_admin / can_upload (state)
state_dir     = "/data"                # jwt_secret (state)
base_path     = "/htwicket"
listen        = "0.0.0.0:52155"        # overridden by HTWICKET_LISTEN
app_title_html = "Clapshot"            # overridden by HTWICKET_APP_TITLE_HTML

# Who may open /htwicket/admin: anyone named 'admin' or with the is_admin field set.
[superadmins]
expr = "username == 'admin' || fields.is_admin"

# Per-user fields (overridable per user in the sidecar via the admin UI).
[fields.display_name]
type = "string"
default = ""
user_editable_expr = "true"

[fields.is_admin]
type = "bool"
default = false

[fields.can_upload]
type = "bool"
default = true
user_visible = true

# Headers forwarded to nginx/clapshot-server. (X-Remote-User-Id is emitted automatically.)
[headers.X-Remote-User-Name]
type = "string"
expr = "fields.display_name != '' ? fields.display_name : username"

[headers.X-Remote-User-Is-Admin]
type = "bool"
expr = "username == 'admin' || fields.is_admin"

[headers.X-Remote-User-Can-Upload]
type = "bool"
expr = "fields.can_upload"
