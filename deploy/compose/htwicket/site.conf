# htwicket: serve the SPA + proxy /api, gated by htwicket's session via auth_request.
# htwicket emits the X-Remote-User-* headers, which we forward to clapshot-server.
server {
    listen 80 default_server;
    absolute_redirect off;

    location /api/health { proxy_pass http://clapshot-server:8095/api/health; }   # never authenticated

    location / {
        auth_request /htwicket/auth;
        auth_request_set $sc $upstream_http_set_cookie;
        add_header Set-Cookie $sc;
        error_page 401 = @login;

        root /var/www/clapshot-client;
        index index.html;
        try_files $uri $uri/ =404;
        location /videos { alias /mnt/clapshot-data/data/videos; }
        include snippets/clapshot-cache.conf;
    }
    location @login { return 302 /htwicket/login?rd=$request_uri; }

    location /api {
        auth_request /htwicket/auth;
        auth_request_set $uid   $upstream_http_x_remote_user_id;
        auth_request_set $uname $upstream_http_x_remote_user_name;
        auth_request_set $uadm  $upstream_http_x_remote_user_is_admin;
        auth_request_set $uupl  $upstream_http_x_remote_user_can_upload;
        auth_request_set $sc    $upstream_http_set_cookie;
        add_header Set-Cookie $sc;

        proxy_set_header X-Remote-User-Id         $uid;
        proxy_set_header X-Remote-User-Name       $uname;
        proxy_set_header X-Remote-User-Is-Admin   $uadm;
        proxy_set_header X-Remote-User-Can-Upload $uupl;

        proxy_pass http://clapshot-server:8095/api;
        include snippets/clapshot-proxy-params.conf;
    }

    # htwicket's own pages (login / account / admin)
    location /htwicket/ {
        proxy_pass http://htwicket:52155;
        proxy_set_header Host $http_host;   # full host:port for htwicket's CSRF (Origin vs Host) check
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Internal auth subrequest target (htwicket validates the session cookie).
    location = /htwicket/auth {
        internal;
        proxy_pass http://htwicket:52155/htwicket/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 502 504 @down;
    location @down {
        default_type text/html;
        return 502 '<!doctype html><meta charset="utf-8"><title>Clapshot</title><h1>Clapshot backend not running</h1>';
    }
}
