# Reverse-proxy mechanics shared by every recipe (baked into clapshot-web, included by
# each site.conf inside `location /api`). NO auth and NO X-Remote-User-* here — those are
# set per-scheme in the site.conf, from whatever authenticated the request.
proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host       $host;
proxy_set_header X-Real-IP  $remote_addr;
proxy_read_timeout 2h;
proxy_send_timeout 2h;
client_body_buffer_size 256k;
client_max_body_size    50g;
proxy_request_buffering off;     # stream uploads straight to clapshot-server (no nginx temp files)
