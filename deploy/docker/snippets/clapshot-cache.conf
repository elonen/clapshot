# Caching rules for the web client, shared by every recipe (included inside `location /`).
location ~* \.html$                    { expires -1;  add_header Cache-Control "no-cache, no-store, must-revalidate"; }
location = /clapshot_client.conf.json  { expires -1;  add_header Cache-Control "no-cache, no-store, must-revalidate"; }
location ~* \.(json|conf|js|css)$      { expires 12h; add_header Cache-Control "public, no-transform"; }
