name: Release (.debs + container images)

on:
  push:
    tags:
      - 'v*'  # Trigger the workflow on push tags like v1.0, v1.1, etc.

jobs:
  # Run tests first to ensure quality
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run full test suite
      run: make test

  build-debian-package:
    needs: test  # Only build if tests pass
    # One native runner per arch; each leg builds both Debian releases.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Build .deb files (${{ matrix.arch }}, native, both distros)
      run: |
        for debver in bookworm trixie; do
          make debian-docker-one DEBIAN_VER=$debver TARGET_ARCH=${{ matrix.arch }}
        done

    - name: List built packages
      run: ls -la dist_deb/

    - name: Upload Debian Package
      uses: actions/upload-artifact@v4
      with:
        name: debian-packages-${{ matrix.arch }}
        path: ./dist_deb/*.deb
        retention-days: 90

  # Assemble + push the container images from the .debs built above (no recompile):
  #   - per-service images (clapshot-server, clapshot-web)        -> ghcr.io  (GITHUB_TOKEN)
  #   - all-in-one demo images (clapshot:*-demo[-htwicket])       -> Docker Hub (DOCKERHUB_* secrets)
  publish-images:
    needs: build-debian-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download .debs built above (both arches)
        uses: actions/download-artifact@v4
        with:
          pattern: debian-packages-*
          merge-multiple: true
          path: dist_deb

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push per-service images to ghcr.io
        run: make push-services-ghcr

      - name: Push demo images to Docker Hub
        run: make push-demo-hub

  create-release:
    needs: build-debian-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts (both arches)
        uses: actions/download-artifact@v4
        with:
          pattern: debian-packages-*
          merge-multiple: true
          path: dist_deb

      - name: Generate release notes
        id: release_notes
        run: |
          echo "## Debian Packages" >> release_notes.md
          echo "This release includes the following packages:" >> release_notes.md
          echo "" >> release_notes.md
          for file in dist_deb/*.deb; do
            if [ -f "$file" ]; then
              echo "- $(basename "$file")" >> release_notes.md
            fi
          done
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "Download the appropriate .deb file and install with:" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo 'sudo dpkg -i <package-name>.deb' >> release_notes.md
          echo 'sudo apt-get install -f  # Fix any dependency issues' >> release_notes.md
          echo '```' >> release_notes.md

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist_deb/*.deb
          body_path: release_notes.md
          generate_release_notes: true
