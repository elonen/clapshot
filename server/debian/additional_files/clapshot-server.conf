[general]

# User-facing URL where Clapshot is exposed on.
# (This will typically be something like `https://clapshot.example.com`)
url-base = http://127.0.0.1:8080

# Location for database and video files
data-dir = /mnt/clapshot-data/data

#  Server should usually listen on localhost only, while a reverse proxy
# relays requests from the `url-base` address to it. You'll probably only
# need to change this if you are running reverse proxy on a separate hos.
host = 127.0.0.1
port = 8095

# Which Organizer plugin to run (if any)? Unless you have a custom one,
# leave this to basic-folders, as it will give you user folder UI.
org-cmd = /usr/bin/clapshot-organizer-basic-folders

# Regular expression to filter HTTP headers passed to Organizer.
# Edit this if your custom Organizer needs to receive more headers from reverse proxy.
# (Security note! Also make sure the proxy is configured to replace them so clients can't set them to arbitrary values.)
org-http-headers = ^X[-_]REMOTE[-_]USER[-_]CAN[-_]UPLOAD$

# Automatically run DB migrations on startup? This is generally safe, as
# Clapshot will make a backup first, but if extra cautious, set 'false'.
migrate = true


### VIDEO PROCESSING

# Target (max) bitrate for transcoding, in Mbps.
# If video is already below (or near) this bitrate, it will not be transcoded
# unless original format is unsupported for streaming.
#bitrate = 2.5

# Number of workers to use for transcoding. 0 means autodetect.
#workers = 0

# Polling interval for incoming folder, in seconds
#poll = 3

# Custom transcoding and thumbnailing scripts (optional)
# If not specified, uses default scripts shipped with Clapshot
transcode-script = /usr/share/clapshot-server/scripts/clapshot-transcode
thumbnail-script = /usr/share/clapshot-server/scripts/clapshot-thumbnail

# Custom transcoding decision script (optional)
# This script determines whether a file needs transcoding based on codec, container, bitrate etc.
# Output: JSON with {"transcode": true/false, "reason": "...", "bitrate": 123456}
transcode-decision-script = /usr/share/clapshot-server/scripts/clapshot-transcode-decision


### NOTIFICATIONS

# Optional external notification hook.
#notification-script = /usr/share/clapshot-server/scripts/clapshot-notification

# Comma-separated glob allowlist of events to deliver (default '*' = all).
#notification-events = *


### DEVELOPMENT / DEBUGGING

# Verbose logging?
debug = false

# Log file path
log = /var/log/clapshot.log

# Log output in JSON format?
#json = false

# Uncomment if you need to allow API calls from any origin (NEVER use in
# production!). If not set, defaults to url-base, which should be a safe default.
# Separate multiple CORS origins by comma, if necessary
#cors = *

# Change the default fallback user id (default is 'anonymous')
# in case the server doesn't receive authentication headers. This is useful for testing.
#default-user = admin

# How to determine username for files in incoming/ folder (default is 'file-owner')
# 'file-owner' uses filesystem ownership, 'folder-name' uses first subfolder name.
# Use 'folder-name' to support (S)FTP uploads without OS-level user accounts.
#ingest-username-from = file-owner


### S3-COMPATIBLE OBJECT STORAGE

# Storage backend: 'local' (default) or 's3'.
# When set to 's3', media files are stored in an S3-compatible bucket (MinIO, AWS S3, etc.)
# instead of the local filesystem. The server still keeps the database, thumbnails, and
# temporary files locally under data-dir.
#storage-backend = local

# S3 bucket name (required when storage-backend = s3).
#s3-bucket = clapshot-media

# S3-compatible endpoint URL. Required for MinIO and other self-hosted S3-compatible
# services. Leave unset for AWS S3; the SDK will use the standard AWS endpoints.
#s3-endpoint = http://127.0.0.1:9000

# S3 region (e.g. us-east-1). For AWS S3 this overrides the AWS_REGION environment variable.
# For MinIO this is usually ignored by the server itself but may be required by SDK calls.
#s3-region = us-east-1

# Path prefix inside the bucket where media objects are stored. Defaults to 'videos'.
#s3-prefix = videos

# Public base URL for the bucket/prefix. Deprecated: playback URLs are now server-mediated
# presigned redirects, so the bucket no longer needs to be publicly readable.
#s3-public-url = http://127.0.0.1:9000/clapshot-media

# Lifetime of presigned S3 URLs returned to clients, in seconds. Defaults to 3600.
#s3-presigned-url-expiry = 3600

# Credentials are resolved automatically by the AWS SDK in this order:
#   1. Environment variables: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   2. Shared credentials file: ~/.aws/credentials
#   3. AWS config file: ~/.aws/config (with profiles)
#   4. ECS container credentials
#   5. EC2 instance metadata (IAM role)
# For MinIO, set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY to your MinIO credentials.
