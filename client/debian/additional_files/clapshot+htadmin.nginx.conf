# Nginx configuration file for serving Clapshot with HTTP basic
# auth and soster/htadmin for user management
#
# Copy this to /etc/nginx/sites-available/clapshot and customize.

# Assign admin rights to some usernames
map $remote_user $is_admin {
	default 0;
	admin 1;
	#alice 1;
}

# Assign upload permissions to users (deny for bob)
map $remote_user $can_upload {
	default true;
	bob false;
}

server {

	listen 80 default_server;
	listen [::]:80 default_server;

	server_name clapshot.example.com;

	# Clapshot paths
	location / {
		root /var/www/clapshot-client;
		index index.html;
		try_files $uri $uri/ =404;

		# Use HTTP basic auth, this can be edited by
		# htadmin (see below)
		auth_basic "Clapshot login";
		auth_basic_user_file /var/www/.htpasswd;
		proxy_set_header X-Remote-User-Id $remote_user;
		proxy_set_header X-Remote-User-Name $remote_user;
		proxy_set_header X-Remote-User-Is-Admin $is_admin;
		proxy_set_header X-Remote-User-Can-Upload $can_upload;

		location /videos {
				alias /mnt/clapshot-data/data/videos;
		}

		# API (clapshot-server)
		location /api {
			proxy_pass http://127.0.0.1:8095/api;

			# Also pass along websocket
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
			proxy_set_header Host $host;
			proxy_read_timeout 2h;
			proxy_send_timeout 2h;

			# Pass authenticated username to backend
			proxy_set_header X-Remote-User-Id $remote_user;
			proxy_set_header X-Remote-User-Name $remote_user;
			proxy_set_header X-Remote-User-Is-Admin $is_admin;
			proxy_set_header X-Remote-User-Can-Upload $can_upload;

			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $remote_addr;  #...or '$proxy_add_x_forwarded_for' if this is behind another proxy

			# Allow large uploads
			# (TODO: maybe limit to /api/upload ?)
			client_body_buffer_size		256K;
			client_max_body_size		50G;
			proxy_request_buffering		off;
		}

		# HTML - no caching, to support Svelte/Vite cache busting when upgrading client
		location ~* \.html$ {
			expires -1;
			add_header Cache-Control "no-cache, no-store, must-revalidate";
		}
		location ~* \.(json|conf|js|css)$ {
			expires 12h;
			add_header Cache-Control "public, no-transform";
		}
	}

	location /api/health {
		proxy_pass http://127.0.0.1:8095/api/health;  # Skip auth for health check
	}

	# Friendlier page when the backend (clapshot-server) is down or crashed,
	# instead of a bare "502 Bad Gateway"
	error_page 502 504 @backend_down;
	location @backend_down {
		default_type text/html;
		return 502 '<!doctype html><meta charset="utf-8"><title>Clapshot</title><h1>Clapshot backend not running</h1><p>The clapshot-server process is not responding. Check the server logs.</p>';
	}

	# Htadmin for user management
	location /htadmin {
			index index.php;
			root /var/www;

		location ~ \.php$ {
			include snippets/fastcgi-php.conf;
			fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
		}
	}
	location /htadmin/config {
			deny  all;
	}
	location /logout {
		# Force re-authentication
		add_header Clear-Site-Data "*" always;
		add_header Cache-Control "no-cache, no-store, must-revalidate" always;
		add_header Pragma "no-cache" always;
		add_header Expires 0;
		return 401;
	}
}
