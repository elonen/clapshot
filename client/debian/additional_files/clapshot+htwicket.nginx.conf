# Nginx configuration file for serving Clapshot with htwicket
# (https://github.com/elonen/htwicket) for login + user management.
#
# htwicket is a small static-Rust nginx `auth_request` gateway that manages
# /var/www/.htpasswd, provides a real login form + cookie logout, and emits the
# X-Remote-User-* headers Clapshot consumes. It listens on 127.0.0.1:52155.
#
# Copy this to /etc/nginx/sites-available/clapshot and customize.

server {

	listen 80 default_server;
	listen [::]:80 default_server;

	server_name clapshot.example.com;

	# This server may be published on a different port (e.g. :8080) or behind a
	# reverse proxy, so keep nginx's own redirects relative to the request.
	absolute_redirect off;

	underscores_in_headers off;   # drop client X_Remote_User_* spoofs (only hyphen names are auth-controlled)

	# Health check must stay UNAUTHENTICATED (client uses it to probe the backend)
	location /api/health {
		proxy_pass http://127.0.0.1:8095/api/health;
	}

	# Clapshot client (static SPA) - gate behind login
	location / {
		auth_request /htwicket/auth;
		auth_request_set $sc $upstream_http_set_cookie;
		add_header Set-Cookie $sc;   # re-mint session cookie (nginx omits the header when empty)
		error_page 401 = @login;

		root /var/www/clapshot-client;
		index index.html;
		try_files $uri $uri/ =404;

		location /videos {
			alias /mnt/clapshot-data/data/videos;   # inherits auth_request from the parent location
		}

		# HTML - no caching, to support Svelte/Vite cache busting when upgrading client
		location ~* \.html$ {
			expires -1;
			add_header Cache-Control "no-cache, no-store, must-revalidate";
		}
		# Runtime-generated config: fixed name, mutable contents - never cache
		location = /clapshot_client.conf.json {
			expires -1;
			add_header Cache-Control "no-cache, no-store, must-revalidate";
		}
		location ~* \.(json|conf|js|css)$ {
			expires 12h;
			add_header Cache-Control "public, no-transform";
		}
	}

	# Unauthenticated browser hits on the SPA get redirected to the login form.
	location @login {
		return 302 /htwicket/login?rd=$request_uri;
	}

	# API (clapshot-server) - authenticate, then inject identity headers
	location /api {
		auth_request /htwicket/auth;
		auth_request_set $uid   $upstream_http_x_remote_user_id;
		auth_request_set $uname $upstream_http_x_remote_user_name;
		auth_request_set $uadm  $upstream_http_x_remote_user_is_admin;
		auth_request_set $uupl  $upstream_http_x_remote_user_can_upload;
		auth_request_set $sc    $upstream_http_set_cookie;
		add_header Set-Cookie $sc;

		# NOTE: no `error_page 401 @login` here -> API/WS callers get a plain 401,
		# not an HTML redirect.

		proxy_pass http://127.0.0.1:8095/api;

		# Also pass along websocket
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header Host $host;
		proxy_read_timeout 2h;
		proxy_send_timeout 2h;

		# Pass authenticated user identity to backend
		proxy_set_header X-Remote-User-Id $uid;
		proxy_set_header X-Remote-User-Name $uname;
		proxy_set_header X-Remote-User-Is-Admin $uadm;
		proxy_set_header X-Remote-User-Can-Upload $uupl;

		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;  #...or '$proxy_add_x_forwarded_for' if this is behind another proxy

		# Allow large uploads
		client_body_buffer_size		256K;
		client_max_body_size		50G;
		proxy_request_buffering		off;
	}

	# htwicket UI: login / logout / account / admin pages
	location /htwicket/ {
		proxy_pass http://127.0.0.1:52155;
		proxy_set_header Host $http_host;   # full host:port, needed for htwicket's CSRF (Origin vs Host) check
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	# Internal auth subrequest target (htwicket validates the session cookie).
	# Marked 'internal' so browsers can't call it directly.
	location = /htwicket/auth {
		internal;
		proxy_pass http://127.0.0.1:52155/htwicket/auth;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	# Friendlier page when the backend (clapshot-server) is down or crashed,
	# instead of a bare "502 Bad Gateway"
	error_page 502 504 @backend_down;
	location @backend_down {
		default_type text/html;
		return 502 '<!doctype html><meta charset="utf-8"><title>Clapshot</title><h1>Clapshot backend not running</h1><p>The clapshot-server process is not responding. Check the server logs.</p>';
	}
}
